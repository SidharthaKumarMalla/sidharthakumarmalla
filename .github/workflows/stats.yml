name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          filename: github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: sidharthakumarmalla
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          plugin_lines: yes
          output_action: commit
          committer_branch: main
          committer_message: "📊 Update stats card"

      - name: Generate Languages Card
        uses: lowlighter/metrics@latest
        with:
          filename: top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: sidharthakumarmalla
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_threshold: 2%
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_branch: main
          committer_message: "📊 Update languages card"
